pre-commit:
  jobs:
    - name: gitleaks
      run: moon run root:security/gitleaks
    - name: golang-linter
      glob: "*.go"
      run: moon run root:go/lint
    - name: golang-audit
      run: moon run root:go/audit
    - name: buf-linter
      run: moon run root:buf/lint

pre-push:
  jobs:
    - name: golang-audit
      run: moon run root:go/audit

commit-msg:
  jobs:
    - name: commit-message
      run: bash scripts/commit-message.sh "{1}"
