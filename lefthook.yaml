pre-commit:
  jobs:
    - name: golang-linter
      glob: "*.go"
      run: just go-lint
    - name: golang-audit
      run: just go-audit
    - name: buf-linter
      run: just buf-lint

pre-push:
  jobs:
    - name: golang-audit
      run: just go-audit

commit-msg:
  jobs:
    - name: commit-message
      run: bash scripts/commit-message.sh "{1}"
